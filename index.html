<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #paintCanvas {
            width: 100%;
            height: 1000px;
            display: block;
            background: white;
            touch-action: none;
        }
    </style>
    
</head>

<body class="text-center"
    style="background-image: url('images/paintingmain.jpg'); background-size: cover; background-size: cover; background-repeat: no-repeat; background-position: center;">

    <div class="container" style="background-color: white; border: 2px solid black; border-radius: 20px;">

        <div class="row">
            <div class="col text-center mt-5 mx-3"
                style="border-bottom: 5px solid black;  box-shadow: 5px 5px 10px black;">
                <h1>Macrosoft Paint</h1>
            </div>
        </div>

        <div class="row">
            <div class="col text-center pt-3 m-5"
                style="background-color: grey; border: 2px solid black; border-radius: 20px; box-shadow: 5px 5px 10px black;">
                <p>Welcome to Macrosoft Paint, have fun a draw what ever you want!</p>
            </div>
        </div>

        <div class="row text-center">

    <div class="col-4 p-2">
        <div class="color p-4" data-color="red"
             style="background-color:red; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="blue"
             style="background-color:blue; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="yellow"
             style="background-color:yellow; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="orange"
             style="background-color:orange; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="green"
             style="background-color:green; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="purple"
             style="background-color:purple; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="black"
             style="background-color:black; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="grey"
             style="background-color:grey; border:2px solid black; border-radius:20px;"></div>
    </div>

    <div class="col-4 p-2">
        <div class="color p-4" data-color="white"
             style="background-color:white; border:2px solid black; border-radius:20px;"></div>
    </div>

    <!-- Eraser underneath -->
    <div class="col-12 mt-2">
        <div class="color p-2 mx-auto"
             data-color="white"
             style="background-color:white; border:2px solid black; border-radius:20px; width:30%;">
            <h6 class="mb-0">Eraser</h6>
        </div>
    </div>

</div>
            
            <div class="row justify-content-center" 
                style=" background-color: yellow; border: 2px solid black; border-radius: 20px; box-shadow: 5px 5px 10px black;">
                <div class="col-12 p-3">
                    <canvas id="paintCanvas"></canvas>
                </div>
            </div>
            
        </div>

    </div>

    <script type="text/javascript">

const canvas = document.getElementById("paintCanvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let currentColor = "black";

canvas.style.touchAction = "none";

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.strokeStyle = currentColor;


function getPosition(e) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}


function startDrawing(e) {

    e.preventDefault();

    drawing = true;

    // Keep track of the finger/mouse
    canvas.setPointerCapture(e.pointerId);

    const position = getPosition(e);

    ctx.beginPath();
    ctx.moveTo(position.x, position.y);
}


function draw(e) {

    if (!drawing) {
        return;
    }

    e.preventDefault();

    const position = getPosition(e);

    ctx.lineTo(position.x, position.y);

    ctx.strokeStyle = currentColor;
    ctx.stroke();
}


function stopDrawing(e) {

    if (!drawing) {
        return;
    }

    e.preventDefault();

    drawing = false;

    ctx.closePath();
}


canvas.addEventListener("pointerdown", startDrawing);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("pointerleave", stopDrawing);

document.querySelectorAll(".color").forEach(function (box) {

    box.addEventListener("click", function () {

        currentColor = this.dataset.color;

        ctx.strokeStyle = currentColor;

    });

});


document.addEventListener("keydown", function (e) {

    switch (e.key) {

        case "1":
            currentColor = "red";
            break;

        case "2":
            currentColor = "blue";
            break;

        case "3":
            currentColor = "yellow";
            break;

        case "4":
            currentColor = "orange";
            break;

        case "5":
            currentColor = "green";
            break;

        case "6":
            currentColor = "purple";
            break;

        case "7":
            currentColor = "black";
            break;

        case "8":
            currentColor = "grey";
            break;

        case "9":
            currentColor = "white";
            break;

        case "0":
            currentColor = "white";
            break;

        default:
            return;
    }

    ctx.strokeStyle = currentColor;

});

    </script>
</body>

</html>
